configs:
  - name: html
    values:
      - name: "APP_RELEASE"
        valueFrom: "env:RELEASE"
      - name: "APP_STAGE"
        valueFrom: "func:stage"

inject:
  - name: "html"
    sourceGlob: "**/*.html"
    sourcePrefix: "dist"
    config: html

deploy:

  context:
    accountId: "000000000000"
    region: us-east-1

  s3:
      bucket: myapp-dev-website
      stateFile: true

  cloudfront:
    distributionId: CF000000000000

  prefix: dist

  files:
    - includeGlob: "**/*.html"
      cacheControl: "no-cache, must-revalidate"
      purge: true
      invalidate: true
      priority: 2

    - includeGlob:
        - "assets/**/*"
      cacheControl: "public, max-age=2628000, immutable"
      priority: 1
      purge:
        keepDays: 2
        keepVersions: 2

    - includeGlob: "**/*"
      cacheControl: "no-cache, must-revalidate"
      invalidate: true
      priority: 2

